[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moonvit-deepseek-glue"
version = "0.1.0"
description = "Backbone-agnostic MoonViT-to-causal-LM glue with a DeepSeek-V4 compatibility seam"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "transformers>=5.12,<6",
  "safetensors>=0.5",
  "pillow>=10",
]

[project.optional-dependencies]
test = ["pytest>=8"]
large-model = ["accelerate>=1.2"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
