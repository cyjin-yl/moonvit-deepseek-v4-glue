<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590">
  <rect width="1000" height="590" fill="white"/>
  <style>
    text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#172033}
    .axis{stroke:#475569;stroke-width:1.4}.grid{stroke:#dbe2ea;stroke-width:1}
    .collapse{stroke:#dc2626;stroke-width:3;fill:none}.loss{stroke:#2563eb;stroke-width:3;fill:none}
    .spread{stroke:#d97706;stroke-width:3;fill:none}.rank{stroke:#7c3aed;stroke-width:3;fill:none}
    .point{stroke:white;stroke-width:1.5}.threshold{stroke:#64748b;stroke-width:1.4;stroke-dasharray:7 6}
  </style>
  <title>Qwen2.5-3B projector collapse trajectory</title>
  <desc>Projector sample RMS and disjoint loss-window mean above; step0-relative spread and participation-rank ratios below.</desc>
  <text x="500" y="31" text-anchor="middle" font-size="21" font-weight="700">Projector collapse is present by the first saved checkpoint</text>
  <rect x="236" y="55" width="704" height="475" fill="#fef2f2" opacity="0.55"/>
  <text x="248" y="72" font-size="12" fill="#991b1b">all saved trained checkpoints satisfy both collapse guards</text>

  <line class="grid" x1="90" y1="260" x2="940" y2="260"/><line class="grid" x1="90" y1="170" x2="940" y2="170"/><line class="grid" x1="90" y1="80" x2="940" y2="80"/>
  <line class="axis" x1="90" y1="80" x2="90" y2="260"/><line class="axis" x1="90" y1="260" x2="940" y2="260"/>
  <text x="80" y="264" text-anchor="end" font-size="12">0</text><text x="80" y="174" text-anchor="end" font-size="12">50</text><text x="80" y="84" text-anchor="end" font-size="12">100</text>
  <text x="21" y="170" transform="rotate(-90 21 170)" text-anchor="middle" font-size="13">projector sample RMS</text>
  <text x="950" y="264" font-size="12" fill="#2563eb">loss 0</text><text x="950" y="84" font-size="12" fill="#2563eb">loss 5</text>
  <polyline class="collapse" points="90,259.8 260,195.7 430,179.8 600,152.9 770,136.4 940,84.8"/>
  <polyline class="loss" points="260,119.0 430,185.5 600,185.5 770,184.9 940,184.8"/>
  <g fill="#dc2626"><circle class="point" cx="90" cy="259.8" r="5"/><circle class="point" cx="260" cy="195.7" r="5"/><circle class="point" cx="430" cy="179.8" r="5"/><circle class="point" cx="600" cy="152.9" r="5"/><circle class="point" cx="770" cy="136.4" r="5"/><circle class="point" cx="940" cy="84.8" r="5"/></g>
  <g fill="#2563eb"><circle class="point" cx="260" cy="119.0" r="5"/><circle class="point" cx="430" cy="185.5" r="5"/><circle class="point" cx="600" cy="185.5" r="5"/><circle class="point" cx="770" cy="184.9" r="5"/><circle class="point" cx="940" cy="184.8" r="5"/></g>
  <line x1="105" y1="98" x2="145" y2="98" class="collapse"/><text x="152" y="102" font-size="12">sample RMS</text>
  <line x1="105" y1="119" x2="145" y2="119" class="loss"/><text x="152" y="123" font-size="12">100-step loss mean (right scale)</text>

  <line class="grid" x1="90" y1="520" x2="940" y2="520"/><line class="grid" x1="90" y1="430" x2="940" y2="430"/><line class="grid" x1="90" y1="340" x2="940" y2="340"/>
  <line class="axis" x1="90" y1="340" x2="90" y2="520"/><line class="axis" x1="90" y1="520" x2="940" y2="520"/>
  <line class="threshold" x1="90" y1="475" x2="940" y2="475"/><line class="threshold" x1="90" y1="430" x2="940" y2="430"/>
  <text x="80" y="524" text-anchor="end" font-size="12">0</text><text x="80" y="434" text-anchor="end" font-size="12">0.5</text><text x="80" y="344" text-anchor="end" font-size="12">1.0</text>
  <text x="23" y="430" transform="rotate(-90 23 430)" text-anchor="middle" font-size="13">ratio to step0</text>
  <text x="925" y="471" text-anchor="end" font-size="11">spread guard 0.25</text><text x="925" y="426" text-anchor="end" font-size="11">rank guard 0.50</text>
  <polyline class="spread" points="90,340 260,496.6 430,497.7 600,497.9 770,493.2 940,495.1"/>
  <polyline class="rank" points="90,340 260,506.1 430,505.8 600,504.9 770,504.6 940,504.5"/>
  <g fill="#d97706"><circle class="point" cx="90" cy="340" r="5"/><circle class="point" cx="260" cy="496.6" r="5"/><circle class="point" cx="430" cy="497.7" r="5"/><circle class="point" cx="600" cy="497.9" r="5"/><circle class="point" cx="770" cy="493.2" r="5"/><circle class="point" cx="940" cy="495.1" r="5"/></g>
  <g fill="#7c3aed"><circle class="point" cx="90" cy="340" r="5"/><circle class="point" cx="260" cy="506.1" r="5"/><circle class="point" cx="430" cy="505.8" r="5"/><circle class="point" cx="600" cy="504.9" r="5"/><circle class="point" cx="770" cy="504.6" r="5"/><circle class="point" cx="940" cy="504.5" r="5"/></g>
  <line x1="105" y1="362" x2="145" y2="362" class="spread"/><text x="152" y="366" font-size="12">relative spread</text>
  <line x1="105" y1="383" x2="145" y2="383" class="rank"/><text x="152" y="387" font-size="12">participation rank</text>
  <g font-size="12" text-anchor="middle"><text x="90" y="547">0</text><text x="260" y="547">100</text><text x="430" y="547">200</text><text x="600" y="547">300</text><text x="770" y="547">400</text><text x="940" y="547">500</text></g>
  <text x="515" y="574" text-anchor="middle" font-size="13">optimizer step (8 examples per step)</text>
</svg>
